<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI chats with AI</title>
    {% load static%}
    <script type="module" crossorigin src="{% static 'assets/index--waAS_HJ.js' %}"></script>
    <link rel="stylesheet" crossorigin href="{% static 'assets/index-BiLVGl7u.css' %}">
  </head>
  <style>
      .waiting-indicator {
        align-self: flex-start;
        direction: ltr;
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 28px;
        margin: 8px 1%;
        padding: 7px 12px;
        background: #ddd7;
        border-radius: 14px;
      }

      .waiting-indicator span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #c124fac3;
        animation: waiting-dot 1.2s infinite ease-in-out;
      }

      .waiting-indicator span:nth-child(2) { animation-delay: .15s; }
      .waiting-indicator span:nth-child(3) { animation-delay: .3s; }

      @keyframes waiting-dot {
        0%, 60%, 100% { transform: translateY(0); opacity: .35; }
        30% { transform: translateY(-5px); opacity: 1; }
      }
    </style>
    <script>
      (() => {
        const originalFetch = window.fetch;

        window.fetch = async (...args) => {
          const url = typeof args[0] === 'string' ? args[0] : args[0]?.url || '';
          const isApiRequest = url.includes('/api/');
          let indicator = null;

          if (isApiRequest) {
            const chats = document.querySelector('.chats');
            if (chats) {
              indicator = document.createElement('div');
              indicator.className = 'waiting-indicator';
              indicator.setAttribute('aria-label', 'در حال دریافت پیام');
              indicator.innerHTML = '<span></span><span></span><span></span>';
              chats.appendChild(indicator);
              chats.scrollTop = chats.scrollHeight;
            }
          }

          try {
            return await originalFetch(...args);
          } finally {
            indicator?.remove();
          }
        };
      })();
    </script>
  <body >
    <div id="root" >
      
    </div>
  </body>
</html>
